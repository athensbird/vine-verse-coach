 who thirsts, come to the waters; and he who has no money, come, buy and eat! Come, buy wine and milk without money and without price. Why do you spend your money for that which is not bread, and your labor for that which does not satisfy? Listen diligently to me, and eat what is good, and delight yourselves in rich food. Incline your ear, and come to me; hear, that your soul may live;`},{ref:`Isaiah 55:8-9`,text:`For my thoughts are not your thoughts, neither are your ways my ways, declares the LORD. For as the heavens are higher than the earth, so are my ways higher than your ways and my thoughts than your thoughts.`},{ref:`Isaiah 57:15`,text:`For thus says the One who is high and lifted up, who inhabits eternity, whose name is Holy: “I dwell in the high and holy place, and also with him who is of a contrite and lowly spirit, to revive the spirit of the lowly, and to revive the heart of the contrite.`},{ref:`Isaiah 66:1-2`,text:`Thus says the LORD: “Heaven is my throne, and the earth is my footstool; what is the house that you would build for me, and what is the place of my rest? All these things my hand has made, and so all these things came to be, declares the LORD. But this is the one to whom I will look: he who is humble and contrite in spirit and trembles at my word.`},{ref:`Jeremiah 9:23-24`,text:`Thus says the LORD: “Let not the wise man boast in his wisdom, let not the mighty man boast in his might, let not the rich man boast in his riches, but let him who boasts boast in this, that he understands and knows me, that I am the LORD who practices steadfast love, justice, and righteousness in the earth. For in these things I delight, declares the LORD.”`},{ref:`Jeremiah 29:11-13`,text:`For I know the plans I have for you, declares the LORD, plans for welfare and not for evil, to give you a future and a hope. Then you will call upon me and come and pray to me, and I will hear you. You will seek me and find me, when you seek me with all your heart.`},{ref:`Jeremiah 33:3`,text:`Call to me and I will answer you, and will tell you great and hidden things that you have not known.`},{ref:`Lamentations 3:21-23`,text:`But this I call to mind, and therefore I have hope: The steadfast love of the LORD never ceases; his mercies never come to an end; they are new every morning; great is your faithfulness.`},{ref:`Joel 2:13`,text:`Rend your hearts and not your garments.” Return to the LORD your God, for he is gracious and merciful, slow to anger, and abounding in steadfast love; and he relents over disaster.`},{ref:`Micah 6:8`,text:`He has told you, O man, what is good; and what does the LORD require of you but to do justice, and to love kindness, and to walk humbly with your God?`},{ref:`Habakkuk 3:17-18`,text:`Though the fig tree should not blossom, nor fruit be on the vines, the produce of the olive fail and the fields yield no food, the flock be cut off from the fold and there be no herd in the stalls, yet I will rejoice in the LORD; I will take joy in the God of my salvation.`},{ref:`Zechariah 4:6b`,text:`Not by might, nor by power, but by my Spirit, says the LORD of hosts.`},{ref:`Zephaniah 3:17`,text:`The LORD your God is in your midst, a mighty one who will save; he will rejoice over you with gladness; he will quiet you by his love; he will exult over you with loud singing.`},{ref:`Malachi 3:10`,text:`Bring the full tithe into the storehouse, that there may be food in my house. And thereby put me to the test, says the LORD of hosts, if I will not open the windows of heaven for you and pour down for you a blessing until there is no more need.`},{ref:`Matthew 6:19-21`,text:`“Do not lay up for yourselves treasures on earth, where moth and rust destroy and where thieves break in and steal, but lay up for yourselves treasures in heaven, where neither moth nor rust destroys and where thieves do not break in and steal. For where your treasure is, there your heart will be also.`},{ref:`Matthew 6:24`,text:`No one can serve two masters, for either he will hate the one and love the other, or he will be devoted to the one and despise the other. You cannot serve God and money.`},{ref:`Matthew 6:33-34`,text:`But seek first the kingdom of God and his righteousness, and all these things will be added to you. Therefore do not be anxious about tomorrow, for tomorrow will be anxious for itself. Sufficient for the day is its own trouble.`},{ref:`Matthew 7:7-8`,text:`Ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you. For everyone who asks receives, and the one who seeks finds, and to the one who knocks it will be opened.`},{ref:`Matthew 7:13-14`,text:`Enter by the narrow gate. For the gate is wide and the way is easy that leads to destruction, and those who enter by it are many. For the gate is narrow and the way is hard that leads to life, and those who find it are few.`},{ref:`Matthew 11:28-29`,text:`Come to me, all who labor and are heavy laden, and I will give you rest. Take my yoke upon you, and learn from me, for I am gentle and lowly in heart, and you will find rest for your souls.`},{ref:`Matthew 22:37-39`,text:`And he said to him, “You shall love the Lord your God with all your heart and with all your soul and with all your mind. This is the great and first commandment. And a second is like it: You shall love your neighbor as yourself.`},{ref:`Matthew 28:18-20`,text:`And Jesus came and said to them, “All authority in heaven and on earth has been given to me. Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all that I have commanded you. And behold, I am with you always, to the end of the age.”`},{ref:`Mark 10:43-45`,text:`But it shall not be so among you. But whoever would be great among you must be your servant, and whoever would be first among you must be slave of all. For even the Son of Man came not to be served but to serve, and to give his life as a ransom for many.”`},{ref:`Luke 9:23-25`,text:`And he said to all, “If anyone would come after me, let him deny himself and take up his cross daily and follow me.” For whoever would save his life will lose it, but whoever loses his life for my sake will save it. For what does it profit a man if he gains the whole world and loses or forfeits himself?”`},{ref:`Luke 10:20`,text:`Nevertheless, do not rejoice in this, that the spirits are subject to you, but rejoice that your names are written in heaven.”`},{ref:`Luke 11:13`,text:`If you then, who are evil, know how to give good gifts to your children, how much more will the heavenly Father give the Holy Spirit to those who ask him!”`},{ref:`Luke 12:32`,text:`Fear not, little flock, for it is your Father's good pleasure to give you the kingdom.`},{ref:`Luke 12:48b`,text:`Everyone to whom much was given, of him much will be required, and from him to whom they entrusted much, they will demand the more.`},{ref:`Luke 14:26`,text:`If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters, yes, and even his own life, he cannot be my disciple.`},{ref:`Luke 17:10`,text:`So you also, when you have done all that you were commanded, say, ‘We are unworthy servants; we have only done what was our duty.’”`},{ref:`John 1:12`,text:`But to all who did receive him, who believed in his name, he gave the right to become children of God`},{ref:`John 1:14`,text:`And the Word became flesh and dwelt among us, and we have seen his glory, glory as of the only Son from the Father, full of grace and truth.`},{ref:`John 3:16`,text:`For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life.`},{ref:`John 5:44`,text:`How can you believe, when you receive glory from one another and do not seek the glory that comes from the only God?`},{ref:`John 6:68-69`,text:`Simon Peter answered him, “Lord, to whom shall we go? You have the words of eternal life, and we have believed, and have come to know, that you are the Holy One of God.”`},{ref:`John 8:31-32`,text:`So Jesus said to the Jews who had believed him, “If you abide in my word, you are truly my disciples, and you will know the truth, and the truth will set you free.”`},{ref:`John 10:10-11`,text:`The thief comes only to steal and kill and destroy. I came that they may have life and have it abundantly. I am the good shepherd. The good shepherd lays down his life for the sheep.`},{ref:`John 10:27-30`,text:`My sheep hear my voice, and I know them, and they follow me. I give them eternal life, and they will never perish, and no one will snatch them out of my hand. My Father, who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand. I and the Father are one.`},{ref:`John 12:24-25`,text:`Truly, truly, I say to you, unless a grain of wheat falls into the earth and dies, it remains alone; but if it dies, it bears much fruit. Whoever loves his life loses it, and whoever hates his life in this world will keep it for eternal life.`},{ref:`John 13:34-35`,text:`A new commandment I give to you, that you love one another: just as I have loved you, you also are to love one another. By this all people will know that you are my disciples, if you have love for one another.”`},{ref:`John 14:1-3`,text:`Let not your hearts be troubled. Believe in God; believe also in me. In my Father's house are many rooms. If it were not so, would I have told you that I go to prepare a place for you? And if I go and prepare a place for you, I will come again and will take you to myself, that where I am you may be also.`},{ref:`John 14:6`,text:`Jesus said to him, “I am the way, and the truth, and the life. No one comes to the Father except through me.`},{ref:`John 14:27`,text:`Peace I leave with you; my peace I give to you. Not as the world gives do I give to you. Let not your hearts be troubled, neither let them be afraid.`},{ref:`John 15:5`,text:`I am the vine; you are the branches. Whoever abides in me and I in him, he it is that bears much fruit, for apart from me you can do nothing.`},{ref:`John 16:33`,text:`I have said these things to you, that in me you may have peace. In the world you will have tribulation. But take heart; I have overcome the world.`},{ref:`Acts 1:8`,text:`But you will receive power when the Holy Spirit has come upon you, and you will be my witnesses in Jerusalem and in all Judea and Samaria, and to the end of the earth.`},{ref:`Acts 3:19`,text:`Repent therefore, and turn back, that your sins may be blotted out.`},{ref:`Acts 4:12`,text:`And there is salvation in no one else, for there is no other name under heaven given among men by which we must be saved.`},{ref:`Acts 20:24`,text:`But I do not account my life of any value nor as precious to myself, if only I may finish my course and the ministry that I received from the Lord Jesus, to testify to the gospel of the grace of God.`},{ref:`Romans 1:16`,text:`For I am not ashamed of the gospel, for it is the power of God for salvation to everyone who believes, to the Jew first and also to the Greek.`},{ref:`Romans 2:4`,text:`Or do you presume on the riches of his kindness and forbearance and patience, not knowing that God's kindness is meant to lead you to repentance?`},{ref:`Romans 3:23`,text:`For all have sinned and fall short of the glory of God.`},{ref:`Romans 5:6-10`,text:`For while we were still weak, at the right time Christ died for the ungodly. For one will scarcely die for a righteous person—though perhaps for a good person one would dare even to die — but God shows his love for us in that while we were still sinners, Christ died for us. Since, therefore, we have now been justified by his blood, much more shall we be saved by him from the wrath of God. For if while we were enemies we were reconciled to God by the death of his Son, much more, now that we are reconciled, shall we be saved by his life.`},{ref:`Romans 6:12-13`,text:`Let not sin therefore reign in your mortal body, to make you obey its passions. Do not present your members to sin as instruments for unrighteousness, but present yourselves to God as those who have been brought from death to life, and your members to God as instruments for righteousness.`},{ref:`Romans 6:23`,text:`For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord.`},{ref:`Romans 8:1-2`,text:`There is therefore now no condemnation for those who are in Christ Jesus. For the law of the Spirit of life has set you free in Christ Jesus from the law of sin and death.`},{ref:`Romans 8:15-16`,text:`For you did not receive the spirit of slavery to fall back into fear, but you have received the Spirit of adoption as sons, by whom we cry, “Abba! Father!” The Spirit himself bears witness with our spirit that we are children of God.`},{ref:`Romans 8:28`,text:`And we know that for those who love God all things work together for good, for those who are called according to his purpose.`},{ref:`Romans 8:37-39`,text:`No, in all these things we are more than conquerors through him who loved us. For I am sure that neither death nor life, nor angels nor rulers, nor things present nor things to come, nor powers, nor height nor depth, nor anything else in all creation, will be able to separate us from the love of God in Christ Jesus our Lord.`},{ref:`Romans 10:9-10`,text:`Because, if you confess with your mouth that Jesus is Lord and believe in your heart that God raised him from the dead, you will be saved. For with the heart one believes and is justified, and with the mouth one confesses and is saved.`},{ref:`Romans 12:1-2`,text:`I appeal to you therefore, brothers, by the mercies of God, to present your bodies as a living sacrifice, holy and acceptable to God, which is your spiritual worship. Do not be conformed to this world, but be transformed by the renewal of your mind, that by testing you may discern what is the will of God, what is good and acceptable and perfect.`},{ref:`Romans 13:8`,text:`Owe no one anything, except to love each other, for the one who loves another has fulfilled the law.`},{ref:`Romans 14:8`,text:`For if we live, we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die, we are the Lord's.`},{ref:`1 Corinthians 1:18`,text:`For the word of the cross is folly to those who are perishing, but to us who are being saved it is the power of God.`},{ref:`1 Corinthians 2:2`,text:`For I decided to know nothing among you except Jesus Christ and him crucified.`},{ref:`1 Corinthians 2:14`,text:`The natural person does not accept the things of the Spirit of God, for they are folly to him, and he is not able to understand them because they are spiritually discerned.`},{ref:`1 Corinthians 6:19-20`,text:`Or do you not know that your body is a temple of the Holy Spirit within you, whom you have from God? You are not your own, for you were bought with a price. So glorify God in your body.`},{ref:`1 Corinthians 9:22b`,text:`I have become all things to all people, that by all means I might save some.`},{ref:`1 Corinthians 9:26-27`,text:`So I do not run aimlessly; I do not box as one beating the air. But I discipline my body and keep it under control, lest after preaching to others I myself should be disqualified.`},{ref:`1 Corinthians 10:13`,text:`No temptation has overtaken you that is not common to man. God is faithful, and he will not let you be tempted beyond your ability, but with the temptation he will also provide the way of escape, that you may be able to endure it.`},{ref:`1 Corinthians 12:18`,text:`But as it is, God arranged the members in the body, each one of them, as he chose.`},{ref:`1 Corinthians 13:13`,text:`So now faith, hope, and love abide, these three; but the greatest of these is love.`},{ref:`1 Corinthians 15:58`,text:`Therefore, my beloved brothers, be steadfast, immovable, always abounding in the work of the Lord, knowing that in the Lord your labor is not in vain.`},{ref:`2 Corinthians 3:5`,text:`Not that we are sufficient in ourselves to claim anything as coming from us, but our sufficiency is from God.`},{ref:`2 Corinthians 3:17`,text:`Now the Lord is the Spirit, and where the Spirit of the Lord is, there is freedom.`},{ref:`2 Corinthians 4:4`,text:`In their case the god of this world has blinded the minds of the unbelievers, to keep them from seeing the light of the gospel of the glory of Christ, who is the image of God.`},{ref:`2 Corinthians 4:7`,text:`But we have this treasure in jars of clay, to show that the surpassing power belongs to God and not to us.`},{ref:`2 Corinthians 4:16-18`,text:`So we do not lose heart. Though our outer self is wasting away, our inner self is being renewed day by day. For this light momentary affliction is preparing for us an eternal weight of glory beyond all comparison, as we look not to the things that are seen but to the things that are unseen. For the things that are seen are transient, but the things that are unseen are eternal.`},{ref:`2 Corinthians 5:7`,text:`For we walk by faith, not by sight.`},{ref:`2 Corinthians 5:14`,text:`For the love of Christ controls us, because we have concluded this: that one has died for all, therefore all have died.`},{ref:`2 Corinthians 5:17`,text:`Therefore, if anyone is in Christ, he is a new creation. The old has passed away; behold, the new has come.`},{ref:`2 Corinthians 6:14`,text:`Do not be unequally yoked with unbelievers. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?`},{ref:`2 Corinthians 7:10`,text:`For godly grief produces a repentance that leads to salvation without regret, whereas worldly grief produces death.`},{ref:`2 Corinthians 9:7`,text:`Each one must give as he has decided in his heart, not reluctantly or under compulsion, for God loves a cheerful giver.`},{ref:`2 Corinthians 11:14`,text:`And no wonder, for even Satan disguises himself as an angel of light.`},{ref:`2 Corinthians 12:9-10`,text:`But he said to me, “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly of my weaknesses, so that the power of Christ may rest upon me. For the sake of Christ, then, I am content with weaknesses, insults, hardships, persecutions, and calamities. For when I am weak, then I am strong.`},{ref:`Galatians 1:10`,text:`For am I now seeking the approval of man, or of God? Or am I trying to please man? If I were still trying to please man, I would not be a servant of Christ.`},{ref:`Galatians 2:20`,text:`I have been crucified with Christ. It is no longer I who live, but Christ who lives in me. And the life I now live in the flesh I live by faith in the Son of God, who loved me and gave himself for me.`},{ref:`Galatians 5:16-17`,text:`But I say, walk by the Spirit, and you will not gratify the desires of the flesh. For the desires of the flesh are against the Spirit, and the desires of the Spirit are against the flesh, for these are opposed to each other, to keep you from doing the things you want to do.`},{ref:`Galatians 5:22-23`,text:`But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, self-control; against such things there is no law.`},{ref:`Galatians 6:2`,text:`Bear one another's burdens, and so fulfill the law of Christ.`},{ref:`Galatians 6:7-9`,text:`Do not be deceived: God is not mocked, for whatever one sows, that will he also reap. For the one who sows to his own flesh will from the flesh reap corruption, but the one who sows to the Spirit will from the Spirit reap eternal life. And let us not grow weary of doing good, for in due season we will reap, if we do not give up.`},{ref:`Galatians 6:14`,text:`But far be it from me to boast except in the cross of our Lord Jesus Christ, by which the world has been crucified to me, and I to the world.`},{ref:`Ephesians 1:3`,text:`Blessed be the God and Father of our Lord Jesus Christ, who has blessed us in Christ with every spiritual blessing in the heavenly places.`},{ref:`Ephesians 2:8-10`,text:`For by grace you have been saved through faith. And this is not your own doing; it is the gift of God, not a result of works, so that no one may boast. For we are his workmanship, created in Christ Jesus for good works, which God prepared beforehand, that we should walk in them.`},{ref:`Ephesians 2:14`,text:`For he himself is our peace, who has made us both one and has broken down in his flesh the dividing wall of hostility.`},{ref:`Ephesians 3:16-21`,text:`That according to the riches of his glory he may grant you to be strengthened with power through his Spirit in your inner being, so that Christ may dwell in your hearts through faith—that you, being rooted and grounded in love, may have strength to comprehend with all the saints what is the breadth and length and height and depth, and to know the love of Christ that surpasses knowledge, that you may be filled with all the fullness of God. Now to him who is able to do far more abundantly than all that we ask or think, according to the power at work within us, to him be glory in the church and in Christ Jesus throughout all generations, forever and ever. Amen.`},{ref:`Ephesians 4:11-12`,text:`And he gave the apostles, the prophets, the evangelists, the shepherds and teachers, to equip the saints for the work of ministry, for building up the body of Christ.`},{ref:`Ephesians 4:22-24`,text:`To put off your old self, which belongs to your former manner of life and is corrupt through deceitful desires, and to be renewed in the spirit of your minds, and to put on the new self, created after the likeness of God in true righteousness and holiness.`},{ref:`Ephesians 5:1-2`,text:`Therefore be imitators of God, as beloved children. And walk in love, as Christ loved us and gave himself up for us, a fragrant offering and sacrifice to God.`},{ref:`Ephesians 5:11`,text:`Take no part in the unfruitful works of darkness, but instead expose them.`},{ref:`Ephesians 5:15-16`,text:`Look carefully then how you walk, not as unwise but as wise, making the best use of the time, because the days are evil.`},{ref:`Ephesians 6:10-12`,text:`Finally, be strong in the Lord and in the strength of his might. Put on the whole armor of God, that you may be able to stand against the schemes of the devil. For we do not wrestle against flesh and blood, but against the rulers, against the authorities, against the cosmic powers over this present darkness, against the spiritual forces of evil in the heavenly places.`},{ref:`Philippians 1:6`,text:`And I am sure of this, that he who began a good work in you will bring it to completion at the day of Jesus Christ.`},{ref:`Philippians 1:21`,text:`For to me to live is Christ, and to die is gain.`},{ref:`Philippians 2:1-11`,text:`So if there is any encouragement in Christ, any comfort from love, any participation in the Spirit, any affection and sympathy, complete my joy by being of the same mind, having the same love, being in full accord and of one mind. Do nothing from selfish ambition or conceit, but in humility count others more significant than yourselves. Let each of you look not only to his own interests, but also to the interests of others. Have this mind among yourselves, which is yours in Christ Jesus,who, though he was in the form of God, did not count equality with God a thing to be grasped, but emptied himself, by taking the form of a servant, being born in the likeness of men. And being found in human form, he humbled himself by becoming obedient to the point of death, even death on a cross. Therefore God has highly exalted him and bestowed on him the name that is above every name, so that at the name of Jesus every knee should bow, in heaven and on earth and under the earth, and every tongue confess that Jesus Christ is Lord, to the glory of God the Father.`},{ref:`Philippians 2:13`,text:`For it is God who works in you, both to will and to work for his good pleasure.`},{ref:`Philippians 3:7-8`,text:`But whatever gain I had, I counted as loss for the sake of Christ. Indeed, I count everything as loss because of the surpassing worth of knowing Christ Jesus my Lord. For his sake I have suffered the loss of all things and count them as rubbish, in order that I may gain Christ`},{ref:`Philippians 3:13-14`,text:`Brothers, I do not consider that I have made it my own. But one thing I do: forgetting what lies behind and straining forward to what lies ahead, I press on toward the goal for the prize of the upward call of God in Christ Jesus.`},{ref:`Philippians 4:6-7`,text:`Do not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus.`},{ref:`Philippians 4:8`,text:`Finally, brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable, if there is any excellence, if there is anything worthy of praise, think about these things.`},{ref:`Philippians 4:19`,text:`And my God will supply every need of yours according to his riches in glory in Christ Jesus.`},{ref:`Colossians 3:1-2`,text:`If then you have been raised with Christ, seek the things that are above, where Christ is, seated at the right hand of God. Set your minds on things that are above, not on things that are on earth.`},{ref:`1 Thessalonians 5:16-18`,text:`Rejoice always, pray without ceasing, give thanks in all circumstances; for this is the will of God in Christ Jesus for you.`},{ref:`1 Timothy 6:6-8`,text:`But godliness with contentment is great gain, for we brought nothing into the world, and we cannot take anything out of the world. But if we have food and clothing, with these we will be content.`},{ref:`2 Timothy 1:7`,text:`For God gave us a spirit not of fear but of power and love and selfcontrol.`},{ref:`2 Timothy 1:12`,text:`Which is why I suffer as I do. But I am not ashamed, for I know whom I have believed, and I am convinced that he is able to guard until that Day what has been entrusted to me.`},{ref:`2 Timothy 2:3-4`,text:`Share in suffering as a good soldier of Christ Jesus. No soldier gets entangled in civilian pursuits, since his aim is to please the one who enlisted him.`},{ref:`2 Timothy 2:21`,text:`Therefore, if anyone cleanses himself from what is dishonorable, he will be a vessel for honorable use, set apart as holy, useful to the master of the house, ready for every good work.`},{ref:`2 Timothy 3:16-17`,text:`All Scripture is breathed out by God and profitable for teaching, for reproof, for correction, and for training in righteousness, that the man of God may be complete, equipped for every good work.`},{ref:`2 Timothy 4:6-8`,text:`For I am already being poured out as a drink offering, and the time of my departure has come. I have fought the good fight, I have finished the race, I have kept the faith. Henceforth there is laid up for me the crown of righteousness, which the Lord, the righteous judge, will award to me on that Day, and not only to me but also to all who have loved his appearing.`},{ref:`Hebrews 4:12`,text:`For the word of God is living and active, sharper than any twoedged sword, piercing to the division of soul and of spirit, of joints and of marrow, and discerning the thoughts and intentions of the heart.`},{ref:`Hebrews 4:15-16`,text:`For we do not have a high priest who is unable to sympathize with our weaknesses, but one who in every respect has been tempted as we are, yet without sin. Let us then with confidence draw near to the throne of grace, that we may receive mercy and find grace to help in time of need.`},{ref:`Hebrews 10:23-25`,text:`Let us hold fast the confession of our hope without wavering, for he who promised is faithful. And let us consider how to stir up one another to love and good works, not neglecting to meet together, as is the habit of some, but encouraging one another, and all the more as you see the Day drawing near.`},{ref:`Hebrews 11:1`,text:`Now faith is the assurance of things hoped for, the conviction of things not seen.`},{ref:`Hebrews 11:6`,text:`And without faith it is impossible to please him, for whoever would draw near to God must believe that he exists and that he rewards those who seek him.`},{ref:`Hebrews 12:1-2`,text:`Therefore, since we are surrounded by so great a cloud of witnesses, let us also lay aside every weight, and sin which clings so closely, and let us run with endurance the race that is set before us, looking to Jesus, the founder and perfecter of our faith, who for the joy that was set before him endured the cross, despising the shame, and is seated at the right hand of the throne of God.`},{ref:`Hebrews 12:4`,text:`In your struggle against sin you have not yet resisted to the point of shedding your blood.`},{ref:`Hebrews 12:11`,text:`For the moment all discipline seems painful rather than pleasant, but later it yields the peaceful fruit of righteousness to those who have been trained by it.`},{ref:`James 4:7`,text:`Submit yourselves therefore to God. Resist the devil, and he will flee from you.`},{ref:`1 Peter 1:18-19`,text:`Knowing that you were ransomed from the futile ways inherited from your forefathers, not with perishable things such as silver or gold, but with the precious blood of Christ, like that of a lamb without blemish or spot.`},{ref:`1 Peter 2:9`,text:`But you are a chosen race, a royal priesthood, a holy nation, a people for his own possession, that you may proclaim the excellencies of him who called you out of darkness into his marvelous light.`},{ref:`1 Peter 2:11-12`,text:`Beloved, I urge you as sojourners and exiles to abstain from the passions of the flesh, which wage war against your soul. Keep your conduct among the Gentiles honorable, so that when they speak against you as e love of the Father is not in him. For all that is in the world—the desires of the flesh and the desires of the eyes and pride of life— is not from the Father but is from the world.`},{ref:`1 John 3:16`,text:`By this we know love, that he laid down his life for us, and we ought to lay down our lives for the brothers.`},{ref:`1 John 4:4`,text:`Little children, you are from God and have overcome them, for he who is in you is greater than he who is in the world.`},{ref:`1 John 4:17-19`,text:`By this is love perfected with us, so that we may have confidence for the day of judgment, because as he is so also are we in this world. There is no fear in love, but perfect love casts out fear. For fear has to do with punishment, and whoever fears has not been perfected in love. We love because he first loved us.`},{ref:`1 John 5:3`,text:`For this is the love of God, that we keep his commandments. And his commandments are not burdensome.`},{ref:`1 John 5:13-15`,text:`I write these things to you who believe in the name of the Son of God that you may know that you have eternal life. And this is the confidence that we have toward him, that if we ask anything according to his will he hears us. And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked of him.`},{ref:`Revelation 3:20`,text:`Behold, I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and eat with him, and he with me.`}],schedule:[{date:`2026-08-07`,weekday:`Fri`,budget:170,newRefs:[`Isaiah 1:18`,`Isaiah 40:6-8`,`Isaiah 40:28-31`,`Isaiah 54:2-3`,`Isaiah 55:1-3a`,`Isaiah 55:8-9`,`Isaiah 57:15`,`Isaiah 66:1-2`,`Jeremiah 9:23-24`,`Jeremiah 29:11-13`,`Jeremiah 33:3`,`Lamentations 3:21-23`,`Joel 2:13`,`Micah 6:8`],reviewRefs:[]},{date:`2026-08-08`,weekday:`Sat`,budget:90,newRefs:[`Habakkuk 3:17-18`,`Zechariah 4:6b`,`Zephaniah 3:17`,`Malachi 3:10`,`Matthew 6:19-21`,`Matthew 6:24`,`Matthew 6:33-34`],reviewRefs:[`Isaiah 1:18`,`Isaiah 4 l loses a battle to the Philistines and, in desperation, brings the Ark of the Covenant into camp as a good-luck charm. Israel is routed anyway, the Ark is captured, and Eli’s sons are killed; Eli himself dies on hearing the news. The captured Ark causes disaster among the Philistines — their idol Dagon falls face-down before it — so after seven months they send the Ark back to Israel.`},{chapters:`7`,text:`Samuel leads Israel back to the LORD, defeats the Philistines at Mizpah, and sets up a memorial stone he names Ebenezer ("stone of help").`},{chapters:`8`,text:`Samuel is now old, and his own sons are corrupt judges. The elders of Israel ask Samuel for a king "like all the nations." The LORD tells Samuel the people have not rejected Samuel but have rejected the LORD from being king over them.`},{chapters:`9–10`,text:`Saul, a tall young Benjaminite out searching for his father’s lost donkeys, meets Samuel, who anoints him privately. Saul is then chosen publicly by lot before all Israel — but is found hiding among the baggage. The Spirit of the LORD rushes on him and he prophesies, prompting the saying "Is Saul also among the prophets?"`},{chapters:`11`,text:`Saul rallies Israel and rescues the city of Jabesh-gilead from the Ammonites, winning the people’s confidence as king.`},{chapters:`12`,text:`Samuel gives a farewell address, reviewing Israel’s history and warning the people and their new king to fear and serve the LORD.`},{chapters:`13`,text:`Facing the Philistines at Gilgal and losing patience waiting for Samuel, Saul unlawfully offers the burnt offering himself. Samuel arrives, condemns Saul’s disobedience, and tells him his kingdom will not endure.`},{chapters:`14`,text:`Jonathan (Saul’s son) launches a bold surprise attack on a Philistine garrison. During the ensuing battle Saul makes a rash oath forbidding anyone to eat; Jonathan, unaware, tastes some honey, and is nearly put to death by his own father until the army intervenes and saves him.`},{chapters:`15`,text:`The LORD commands Saul to destroy the Amalekites completely, but Saul spares king Agag and the best of the flocks. Samuel confronts him: "to obey is better than sacrifice." Saul is rejected as king, and Samuel never sees him again.`}],facts:[`Samuel’s parents were Elkanah and Hannah.`,`Samuel served under the priest Eli at Shiloh.`,`Eli’s two wicked sons were Hophni and Phinehas.`,`Saul’s father was Kish; Saul was from the tribe of Benjamin.`,`Saul was first anointed privately by Samuel, then chosen publicly by lot.`,`Jonathan, who rescued the army at Michmash, was Saul’s son.`,`Samuel set up the "Ebenezer" memorial stone after defeating the Philistines at Mizpah.`,`Saul was rejected as king for sparing king Agag and the Amalekite flocks against the LORD’s command.`],verses:[{ref:`1 Samuel 1:27–28`,text:`For this child I prayed, and the LORD has granted me my petition that I made to him. Therefore I have lent him to the LORD. As long as he lives, he is lent to the LORD.” And he worshiped the LORD there.`,blank:`lent`,blankPrompt:`Therefore I have ______ him to the LORD.`},{ref:`1 Samuel 3:9–10`,text:`Therefore Eli said to Samuel, “Go, lie down, and if he calls you, you shall say, ‘Speak, LORD, for your servant hears.’” So Samuel went and lay down in his place. And the LORD came and stood, calling as at other times, “Samuel! Samuel!” And Samuel said, “Speak, for your servant hears.”`,blank:`servant hears`,blankPrompt:`“Speak, for your ______ ______.”`},{ref:`1 Samuel 8:7`,text:`And the LORD said to Samuel, “Obey the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”`,blank:`king`,blankPrompt:`They have rejected me from being ______ over them.`},{ref:`1 Samuel 12:23`,text:`Moreover, as for me, far be it from me that I should sin against the LORD by ceasing to pray for you, and I will instruct you in the good and the right way.`,blank:`sin`,blankPrompt:`Far be it from me that I should ______ against the LORD by ceasing to pray for you.`},{ref:`1 Samuel 15:22`,text:`And Samuel said, “Has the LORD as great delight in burnt offerings and sacrifices, as in obeying the voice of the LORD? Behold, to obey is better than sacrifice, and to listen than the fat of rams.”`,blank:`sacrifice`,blankPrompt:`Behold, to obey is better than ______.`}],quiz:{multipleChoice:[{q:`What tribe was Saul from?`,options:[`Judah`,`Levi`,`Benjamin`,`Ephraim`],answer:2},{q:`Who was Samuel’s mother?`,options:[`Peninnah`,`Hannah`,`Michal`,`Abigail`],answer:1},{q:`Where did young Samuel serve under Eli?`,options:[`Jerusalem`,`Shiloh`,`Bethel`,`Gilgal`],answer:1},{q:`When the LORD called at night, who did the boy Samuel think was calling him?`,options:[`An angel`,`Eli`,`His father`,`No one — he thought he was dreaming`],answer:1},{q:`What happened to the Philistine idol Dagon when the captured Ark was placed near it?`,options:[`It caught fire`,`It fell face-down before the Ark`,`Nothing happened`,`It was smashed by lightning`],answer:1},{q:`Why did Israel’s elders ask Samuel for a king?`,options:[`To be like all the other nations`,`Because Samuel had died`,`Because of a famine`,`Because Eli commanded it`],answer:0},{q:`Who was Saul’s father?`,options:[`Ner`,`Kish`,`Abner`,`Jonathan`],answer:1},{q:`What was Saul doing when he was found after being chosen king by lot?`,options:[`Farming`,`Hiding among the baggage`,`Fighting the Philistines`,`Praying at Shiloh`],answer:1},{q:`What did people say on seeing Saul caught up in prophesying?`,options:[`"Is Saul also among the prophets?"`,`"Is Saul also a priest?"`,`"Where did Saul learn this?"`,`"Is this the new king?"`],answer:0},{q:`Which city did Saul rescue from the Ammonites early in his reign?`,options:[`Bethlehem`,`Jabesh-gilead`,`Hebron`,`Jericho`],answer:1},{q:`What did Saul do wrong at Gilgal in chapter 13?`,options:[`He worshiped an idol`,`He offered the burnt offering himself instead of waiting for Samuel`,`He fled the battle`,`He made a treaty with the Philistines`],answer:1},{q:`Whose rash oath (about eating honey) nearly got him executed by his own father?`,options:[`Samuel`,`Abner`,`Jonathan`,`David`],answer:2},{q:`In chapter 15, whom did Saul spare against the LORD’s explicit command?`,options:[`The Amalekite king Agag`,`The Philistine king`,`His own son`,`Eli’s sons`],answer:0},{q:`According to Samuel in chapter 15, what is better than sacrifice?`,options:[`Fasting`,`To obey`,`Wealth`,`A long prayer`],answer:1}],fillBlank:[0,1,2,3,4],chapterId:[{desc:`Hannah prays for a son at Shiloh and later dedicates him to the LORD.`,chapter:1},{desc:`The Ark of the Covenant is captured by the Philistines; Eli dies.`,chapter:4},{desc:`The elders of Israel demand a king "like all the nations."`,chapter:8},{desc:`Saul spares king Agag and is rejected as king.`,chapter:15}],byTheNumbers:[{q:`How many times did the LORD call to Samuel before Eli realized it was the LORD calling?`,answer:`3`},{q:`How many wicked sons did Eli have?`,answer:`2`}]}},{id:2,title:`David’s Rise, Saul’s Fall`,range:`1 Samuel 16–31`,minutes:105,storyline:[{chapters:`16`,text:`The LORD sends Samuel to Bethlehem to anoint one of Jesse’s sons as the next king. Samuel is told not to judge by appearance — the LORD looks on the heart. The youngest son, David, a shepherd, is anointed. David also begins playing the harp for Saul to soothe him when a harmful spirit troubles him.`},{chapters:`17`,text:`The Philistine champion Goliath taunts Israel’s army for forty days. David, bringing supplies to his brothers, volunteers to fight him, refuses Saul’s armor, and kills Goliath with a sling and a stone in the name of the LORD.`},{chapters:`18`,text:`Jonathan’s soul is "knit" to David’s, and the two make a covenant of friendship. Saul grows jealous as the women sing David has killed "his ten thousands," and Saul begins to fear and plot against David. David marries Saul’s daughter Michal.`},{chapters:`19`,text:`Saul openly tries to kill David. Michal helps David escape through a window, placing a household idol in the bed to fool Saul’s messengers.`},{chapters:`20`,text:`Jonathan and David renew their covenant; Jonathan signals Saul’s murderous intent to David using arrows shot in a field, and the two part in sorrow.`},{chapters:`21–22`,text:`David flees to Nob, where the priest Ahimelech gives him the consecrated bread (the showbread) and Goliath’s sword. Saul later has Ahimelech and the priests of Nob massacred by Doeg the Edomite for helping David.`},{chapters:`23–24`,text:`David, now leading a band of men and living as a fugitive, spares Saul’s life in a cave at En-gedi when he has the chance to kill him, cutting only the corner of his robe to prove it.`},{chapters:`25`,text:`The wealthy but foolish Nabal insults David; his wise wife Abigail intervenes with gifts and counsel, preventing bloodshed. Nabal dies soon after, and David marries Abigail.`},{chapters:`26`,text:`David again spares Saul’s life at night, this time taking Saul’s spear and water jug as proof rather than killing him.`},{chapters:`27–29`,text:`David takes refuge among the Philistines under king Achish of Gath, settling in Ziklag, but is sent away by the wary Philistine commanders before the battle against Israel.`},{chapters:`28`,text:`Desperate and unable to hear from the LORD, Saul consults a medium at Endor, who conjures the spirit of Samuel — who tells Saul he and his sons will die the next day.`},{chapters:`30`,text:`David returns to find Ziklag raided and burned by the Amalekites and his family taken captive. Greatly distressed, "David strengthened himself in the LORD his God," then pursues and recovers everyone and everything.`},{chapters:`31`,text:`Saul and his sons, including Jonathan, are killed in battle against the Philistines on Mount Gilboa. The men of Jabesh-gilead (whom Saul had once rescued) recover the bodies and give them burial.`}],facts:[`David was the youngest son of Jesse of Bethlehem.`,`David killed Goliath, the Philistine champion, with a sling and a stone.`,`David married Saul’s daughter Michal, and later Abigail (Nabal’s widow).`,`Jonathan, Saul’s son, became David’s closest friend.`,`David spared Saul’s life twice — once in a cave at En-gedi, once at night in Saul’s camp.`,`Saul consulted a medium at Endor before his final battle.`,`Saul and Jonathan both died in battle on Mount Gilboa.`],verses:[{ref:`1 Samuel 16:7`,text:`But the LORD said to Samuel, “Do not look on his appearance or on the height of his stature, because I have rejected him. For the LORD sees not as man sees: man looks on the outward appearance, but the LORD looks on the heart.”`,blank:`heart`,blankPrompt:`The LORD looks on the ______.`},{ref:`1 Samuel 17:45`,text:`Then David said to the Philistine, “You come to me with a sword and with a spear and with a javelin, but I come to you in the name of the LORD of hosts, the God of the armies of Israel, whom you have defied.”`,blank:`LORD of hosts`,blankPrompt:`I come to you in the name of the ______ ______ ______.`},{ref:`1 Samuel 18:1`,text:`As soon as he had finished speaking to Saul, the soul of Jonathan was knit to the soul of David, and Jonathan loved him as his own soul.`,blank:`knit`,blankPrompt:`The soul of Jonathan was ______ to the soul of David.`},{ref:`1 Samuel 24:6`,text:`He said to his men, “The LORD forbid that I should do this thing to my lord, the LORD’s anointed, to put out my hand against him, seeing he is the LORD’s anointed.”`,blank:`anointed`,blankPrompt:`He is the LORD’s ______.`},{ref:`1 Samuel 30:6`,text:`And David was greatly distressed, for the people spoke of stoning him, because all the people were bitter in soul, each for his sons and daughters. But David strengthened himself in the LORD his God.`,blank:`strengthened`,blankPrompt:`But David ______ himself in the LORD his God.`}],quiz:{multipleChoice:[{q:`What did the LORD tell Samuel not to judge by, when choosing the next king?`,options:[`His age`,`His outward appearance`,`His wealth`,`His birth order`],answer:1},{q:`Which of Jesse’s sons was anointed king?`,options:[`The oldest`,`The tallest`,`The youngest`,`The strongest`],answer:2},{q:`What was David’s occupation before serving Saul?`,options:[`Soldier`,`Shepherd`,`Priest`,`Scribe`],answer:1},{q:`What weapon did David use to defeat Goliath?`,options:[`A sword`,`A sling and a stone`,`A spear`,`Goliath’s own armor`],answer:1},{q:`Whose soul was "knit" to David’s in friendship?`,options:[`Saul’s`,`Jonathan’s`,`Abner’s`,`Samuel’s`],answer:1},{q:`Which of Saul’s children did David marry?`,options:[`Merab`,`Michal`,`Neither — David never married a daughter of Saul`,`Both Merab and Michal`],answer:1},{q:`How did Michal help David escape Saul’s men?`,options:[`She fought them off`,`She hid him in a well`,`She let him down through a window and put an idol in his bed`,`She bribed them`],answer:2},{q:`How did Jonathan signal to David that Saul meant to kill him?`,options:[`A letter`,`Arrows shot in a field`,`A lit torch`,`A messenger`],answer:1},{q:`Which priest helped David at Nob and was later killed by Saul for it?`,options:[`Ahimelech`,`Zadok`,`Abiathar`,`Eli`],answer:0},{q:`Where did David spare Saul’s life by cutting off a corner of his robe?`,options:[`A cave at En-gedi`,`The camp at Gilboa`,`Ziklag`,`Endor`],answer:0},{q:`Who was the wise woman who prevented David from taking revenge on her foolish husband?`,options:[`Michal`,`Bathsheba`,`Abigail`,`Rizpah`],answer:2},{q:`Who did Saul consult at Endor before his final battle?`,options:[`A prophet`,`A medium`,`A priest`,`His son Jonathan`],answer:1},{q:`What happened to David’s town of Ziklag while he was away?`,options:[`It was destroyed by fire, with no survivors`,`It was raided and burned, families taken captive`,`It flooded`,`Nothing — it was untouched`],answer:1},{q:`On what mountain did Saul and Jonathan die in battle?`,options:[`Mount Carmel`,`Mount Gilboa`,`Mount Sinai`,`Mount Tabor`],answer:1}],fillBlank:[0,1,2,3,4],chapterId:[{desc:`David is anointed by Samuel at Bethlehem.`,chapter:16},{desc:`David kills Goliath with a sling and a stone.`,chapter:17},{desc:`David spares Saul’s life a second time, taking his spear and water jug.`,chapter:26},{desc:`Saul and his sons die in battle on Mount Gilboa.`,chapter:31}],byTheNumbers:[{q:`How many sons of Jesse did Samuel pass over before David was brought in?`,answer:`7`},{q:`How many times did David spare Saul’s life without killing him?`,answer:`2`}]}},{id:3,title:`David Becomes King`,range:`2 Samuel 1–12`,minutes:105,storyline:[{chapters:`1`,text:`An Amalekite falsely claims to have killed Saul, hoping for a reward; David has him executed instead, and laments Saul and Jonathan’s deaths with the lament "How the mighty have fallen."`},{chapters:`2`,text:`David is anointed king over Judah at Hebron. Meanwhile Abner, Saul’s general, makes Saul’s son Ish-bosheth a rival king over the rest of Israel — beginning a long civil war between the two houses.`},{chapters:`3`,text:`Abner eventually defects to David’s side, but Joab (David’s general) murders him in revenge for his brother’s death, angering David.`},{chapters:`4`,text:`Ish-bosheth is murdered by two of his own captains, who bring his head to David expecting a reward — David has them executed instead.`},{chapters:`5`,text:`All the tribes of Israel come to David at Hebron and anoint him king over the whole nation. David captures Jerusalem from the Jebusites and makes it his capital.`},{chapters:`6`,text:`David brings the Ark of the Covenant to Jerusalem. Uzzah, who reaches out to steady it, is struck dead for touching it. When the Ark finally arrives, David dances before the LORD with all his might; his wife Michal despises him for it.`},{chapters:`7`,text:`David wants to build a temple for the LORD, but Nathan the prophet delivers the Davidic Covenant instead: the LORD will build David a "house" — a dynasty — and his throne will be established forever.`},{chapters:`8`,text:`David wins a series of military victories, extending Israel’s borders and establishing his kingdom.`},{chapters:`9`,text:`David shows kindness to Mephibosheth, Jonathan’s crippled son, "for Jonathan’s sake," restoring Saul’s land to him and inviting him to eat at the king’s table always.`},{chapters:`10`,text:`War breaks out with the Ammonites after their new king, Hanun, humiliates David’s messengers of condolence.`},{chapters:`11`,text:`While his army is at war, David stays behind, sees Bathsheba bathing, and sleeps with her. When she becomes pregnant, David has her husband Uriah the Hittite killed in battle to cover it up, then marries Bathsheba.`},{chapters:`12`,text:`Nathan confronts David with a parable about a rich man who steals a poor man’s only lamb. When David condemns the rich man, Nathan says, "You are the man!" David confesses, "I have sinned against the LORD," and Nathan tells him the LORD has put away his sin, though the child born to Bathsheba will die.`}],facts:[`David was first made king over Judah alone, at Hebron, before later becoming king over all Israel.`,`Ish-bosheth, Saul’s son, was set up as a rival king by Abner but was later murdered.`,`David captured Jerusalem from the Jebusites and made it his capital.`,`Uzzah was struck dead for touching the Ark of the Covenant.`,`In the Davidic Covenant, Nathan the prophet told David his throne would be established forever.`,`Mephibosheth was Jonathan’s son; David showed him kindness for Jonathan’s sake.`,`David committed adultery with Bathsheba and had her husband Uriah killed.`,`Nathan confronted David’s sin with the parable of the poor man’s ewe lamb.`],verses:[{ref:`2 Samuel 1:19`,text:`“Your glory, O Israel, is slain on your high places! How the mighty have fallen!”`,blank:`mighty`,blankPrompt:`How the ______ have fallen!`},{ref:`2 Samuel 7:16`,text:`And your house and your kingdom shall be made sure forever before me. Your throne shall be established forever.`,blank:`forever`,blankPrompt:`Your throne shall be established ______.`},{ref:`2 Samuel 9:7`,text:`And David said to him, “Do not fear, for I will show you kindness for the sake of your father Jonathan, and I will restore to you all the land of Saul your father, and you shall eat at my table always.”`,blank:`kindness`,blankPrompt:`I will show you ______ for the sake of your father Jonathan.`},{ref:`2 Samuel 12:7`,text:`Nathan said to David, “You are the man! Thus says the LORD, the God of Israel, ‘I anointed you king over Israel, and I delivered you out of the hand of Saul.’”`,blank:`man`,blankPrompt:`“You are the ______!”`},{ref:`2 Samuel 12:13`,text:`David said to Nathan, “I have sinned against the LORD.” And Nathan said to David, “The LORD also has put away your sin; you shall not die.”`,blank:`sinned`,blankPrompt:`“I have ______ against the LORD.”`}],quiz:{multipleChoice:[{q:`Who falsely claimed to have killed Saul, hoping for a reward from David?`,options:[`A Philistine`,`An Amalekite`,`A Jebusite`,`One of Saul’s own captains`],answer:1},{q:`What did David say in his lament for Saul and Jonathan?`,options:[`"The LORD is my rock"`,`"How the mighty have fallen"`,`"Vengeance is mine"`,`"He restores my soul"`],answer:1},{q:`Where was David first anointed king — over Judah alone?`,options:[`Jerusalem`,`Hebron`,`Bethlehem`,`Gilgal`],answer:1},{q:`Who did Abner make a rival king over the rest of Israel?`,options:[`Jonathan`,`Mephibosheth`,`Ish-bosheth`,`Absalom`],answer:2},{q:`Who killed Abner after he defected to David’s side?`,options:[`David`,`Joab`,`Nathan`,`Uriah`],answer:1},{q:`Which city did David capture and make his capital?`,options:[`Hebron`,`Jericho`,`Jerusalem`,`Bethlehem`],answer:2},{q:`What happened to Uzzah when he touched the Ark of the Covenant?`,options:[`Nothing — he was rewarded`,`He was struck dead`,`He became a priest`,`He was exiled`],answer:1},{q:`How did David’s wife Michal react to his dancing before the Ark?`,options:[`She danced with him`,`She despised him for it`,`She wept for joy`,`She was not present`],answer:1},{q:`What did the LORD promise David through Nathan in the Davidic Covenant?`,options:[`A new temple immediately`,`That his throne would be established forever`,`Victory over all nations`,`A long life`],answer:1},{q:`For whose sake did David show kindness to Mephibosheth?`,options:[`Saul’s`,`Samuel’s`,`Jonathan’s`,`Abner’s`],answer:2},{q:`What was wrong with Mephibosheth, Jonathan’s son?`,options:[`He was blind`,`He was lame in both feet`,`He was mute`,`He was ill`],answer:1},{q:`Who was Bathsheba’s husband, whom David had killed?`,options:[`Uriah the Hittite`,`Joab`,`Nathan`,`Abner`],answer:0},{q:`What did Nathan use to confront David about his sin?`,options:[`A direct accusation`,`A parable about a poor man’s lamb`,`A vision`,`A letter`],answer:1},{q:`What did Nathan tell David after David confessed his sin?`,options:[`He would die immediately`,`The LORD had put away his sin, but the child would die`,`He must step down as king`,`Nothing — Nathan left in silence`],answer:1}],fillBlank:[0,1,2,3,4],chapterId:[{desc:`David laments Saul and Jonathan with "How the mighty have fallen."`,chapter:1},{desc:`The Davidic Covenant is given through Nathan the prophet.`,chapter:7},{desc:`David shows kindness to Mephibosheth for Jonathan’s sake.`,chapter:9},{desc:`Nathan confronts David with the parable of the poor man’s ewe lamb.`,chapter:12}],byTheNumbers:[{q:`How many years did David reign as king over Judah alone at Hebron, before becoming king over all Israel? (see 2 Samuel 5:5)`,answer:`7`},{q:`How many of David’s messengers were humiliated by Hanun, sparking war with the Ammonites?`,answer:`all of them (his whole delegation)`}]}},{id:4,title:`Absalom’s Rebellion & David’s Later Reign`,range:`2 Samuel 13–24`,minutes:105,storyline:[{chapters:`13`,text:`David’s son Amnon rapes his half-sister Tamar. Her full brother Absalom, seething, waits two years and then has Amnon killed in revenge, before fleeing into exile.`},{chapters:`14`,text:`Joab arranges for a "wise woman" of Tekoa to persuade David, through a parable, to allow Absalom to return to Jerusalem.`},{chapters:`15`,text:`Absalom spends years quietly winning over the hearts of Israel at the city gate, then launches an open rebellion at Hebron. David, taken by surprise, flees Jerusalem.`},{chapters:`16`,text:`As David flees, Saul’s servant Ziba deceives David about his master Mephibosheth to gain his land, and Saul’s relative Shimei curses and throws stones at David along the road.`},{chapters:`17`,text:`Absalom weighs two competing counsels — the shrewd Ahithophel versus Hushai (secretly loyal to David) — and follows Hushai’s advice, buying David time to escape. Ahithophel, seeing his counsel rejected, hangs himself.`},{chapters:`18`,text:`David’s forces defeat Absalom’s army. Absalom is caught by his hair in a tree and killed by Joab against David’s explicit orders. David is overcome with grief: "O Absalom, my son, my son!"`},{chapters:`19`,text:`David mourns so openly that Joab rebukes him for demoralizing the troops who fought for him. David returns to Jerusalem and works to reconcile Israel and Judah.`},{chapters:`20`,text:`A Benjaminite named Sheba leads a fresh revolt, which is put down when a wise woman in a besieged city has Sheba’s head thrown over the wall to Joab.`},{chapters:`21`,text:`A three-year famine, caused by Saul’s earlier sin against the Gibeonites, is ended after atonement is made; Saul’s concubine Rizpah guards the bodies of the dead from scavengers.`},{chapters:`22`,text:`David sings a song of praise and deliverance to the LORD: "The LORD is my rock and my fortress and my deliverer."`},{chapters:`23`,text:`David’s "mighty men" and their exploits are recorded, including three who broke through Philistine lines just to bring David water from the well of Bethlehem — water he then poured out to the LORD rather than drink, calling it too precious.`},{chapters:`24`,text:`David sins by taking a census of Israel out of pride; a plague follows as judgment. David buys Araunah’s threshing floor to build an altar, insisting on paying full price: "I will not offer... that costs me nothing."`}],facts:[`Absalom was David’s son and Tamar’s full brother; he killed his half-brother Amnon in revenge for raping Tamar.`,`Absalom led a rebellion against his own father, David.`,`Ahithophel and Hushai gave Absalom competing advice; Absalom followed Hushai’s, to David’s benefit.`,`Absalom was killed by Joab after being caught by his hair in a tree.`,`David’s later census of Israel brought a plague as judgment.`,`David bought Araunah’s threshing floor to build an altar rather than take it for free.`],verses:[{ref:`2 Samuel 18:33`,text:`And the king was deeply moved and went up to the chamber over the gate and wept. And as he went, he said, “O my son Absalom, my son, my son Absalom! Would I had died instead of you, O Absalom, my son, my son!”`,blank:`Absalom`,blankPrompt:`"O my son ______, my son, my son ______!"`},{ref:`2 Samuel 22:2–3`,text:`He said, “The LORD is my rock and my fortress and my deliverer, my God, my rock, in whom I take refuge, my shield, and the horn of my salvation, my stronghold and my refuge, my savior; you save me from violence.”`,blank:`rock`,blankPrompt:`The LORD is my ______ and my fortress and my deliverer.`},{ref:`2 Samuel 24:24`,text:`But the king said to Araunah, “No, but I will buy it from you for a price. I will not offer burnt offerings to the LORD my God that cost me nothing.” So David bought the threshing floor and the oxen for fifty shekels of silver.`,blank:`nothing`,blankPrompt:`I will not offer burnt offerings to the LORD my God that cost me ______.`}],quiz:{multipleChoice:[{q:`Who raped his half-sister Tamar, setting off the events of Absalom’s revenge?`,options:[`Amnon`,`Absalom`,`Adonijah`,`Chileab`],answer:0},{q:`How was Absalom related to Tamar?`,options:[`Cousin`,`Full brother`,`Half-brother only`,`Uncle`],answer:1},{q:`How did Absalom win the loyalty of Israel before his rebellion?`,options:[`Military victories`,`Winning hearts at the city gate over time`,`A public vote`,`Bribing the priests`],answer:1},{q:`Who deceived David about his master Mephibosheth while David fled Jerusalem?`,options:[`Shimei`,`Ziba`,`Ahithophel`,`Hushai`],answer:1},{q:`Who cursed David and threw stones at him as he fled?`,options:[`Shimei`,`Ziba`,`Joab`,`Absalom`],answer:0},{q:`Whose counsel did Absalom follow instead of Ahithophel’s — to David’s benefit?`,options:[`Joab’s`,`Hushai’s`,`Nathan’s`,`Zadok’s`],answer:1},{q:`What happened to Ahithophel after his advice was rejected?`,options:[`He joined David`,`He hanged himself`,`He fled to Egypt`,`He was executed by Absalom`],answer:1},{q:`How was Absalom caught before being killed?`,options:[`His horse fell`,`His hair got caught in a tree`,`He was surrounded and surrendered`,`He was shot with an arrow while fleeing`],answer:1},{q:`Who killed Absalom, against David’s explicit order to deal gently with him?`,options:[`David himself`,`Joab`,`Abishai`,`A random soldier`],answer:1},{q:`What revolt broke out after Absalom’s death, led by a Benjaminite?`,options:[`Sheba’s revolt`,`A Philistine invasion`,`Ziba’s revolt`,`A priestly uprising`],answer:0},{q:`What caused the three-year famine in chapter 21?`,options:[`Drought alone`,`Saul’s earlier sin against the Gibeonites`,`David’s census`,`The Ark being lost`],answer:1},{q:`In David’s song (ch. 22), what does he call the LORD?`,options:[`"My rock and my fortress and my deliverer"`,`"My shepherd"`,`"My light and my salvation"`,`"My portion forever"`],answer:0},{q:`What did David’s mighty men risk their lives to bring him, which he then poured out rather than drink?`,options:[`Wine from Jerusalem`,`Water from the well of Bethlehem`,`Bread from the temple`,`Oil from Gilead`],answer:1},{q:`What sin did David commit in chapter 24 that brought a plague on Israel?`,options:[`Adultery`,`Taking a census of Israel out of pride`,`Idolatry`,`Breaking a covenant`],answe  friend`,day:4,note:`Stayed behind as a double agent and talked Absalom out of Ahithophel’s plan, buying David time to escape (2 Sam 15–17).`},{name:`Ziba`,tag:`Servant of Saul’s house`,day:4,note:`Deceived David about Mephibosheth’s loyalty to gain his land as David fled Jerusalem (2 Sam 16; 19).`},{name:`Shimei son of Gera`,tag:`Benjamin, Saul’s clan`,day:4,note:`Cursed David and threw stones at him along the road out of Jerusalem; later begged pardon (2 Sam 16; 19).`},{name:`Sheba son of Bichri`,tag:`Benjamin`,day:4,note:`Led a revolt after Absalom’s; besieged at Abel of Beth-maacah, where a wise woman had his head thrown over the wall (2 Sam 20).`},{name:`Barzillai`,tag:`Gileadite`,day:4,note:`Supplied David at Mahanaim; too old to accept a place at court on David’s return (2 Sam 17; 19).`},{name:`Araunah`,tag:`Jebusite`,day:4,note:`Offered David his threshing floor free; David insisted on paying — “that cost me nothing” (2 Sam 24).`}],Rs=[{id:`eli`,title:`Eli & Samuel`,range:`1 Samuel 1–7`,day:1,anchor:`Israel is led by judges and priests — no king yet.`,events:[{ref:`1 Sam 1`,text:`Hannah vows her son to the LORD; Samuel is born and brought to Shiloh.`},{ref:`1 Sam 2`,text:`Hophni and Phinehas abuse the priesthood; judgment on Eli’s house is announced.`},{ref:`1 Sam 3`,text:`The LORD calls Samuel at night — he runs to Eli three times before Eli understands.`},{ref:`1 Sam 4`,text:`Israel carries the Ark into battle and loses it; Hophni, Phinehas, then Eli die.`},{ref:`1 Sam 5–6`,text:`The Ark afflicts the Philistines and Dagon falls before it; after seven months it is sent back.`},{ref:`1 Sam 7`,text:`Samuel leads Israel to repent; the Philistines are defeated and the Ebenezer stone is set up.`}]},{id:`saul`,title:`Saul’s reign`,range:`1 Samuel 8–15`,day:1,anchor:`Saul reigns over Israel — traditionally forty years (Acts 13:21).`,events:[{ref:`1 Sam 8`,text:`Israel demands a king “like all the nations”; the LORD says they have rejected him, not Samuel.`},{ref:`
